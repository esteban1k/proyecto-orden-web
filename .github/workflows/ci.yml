# CI del sitio estático (sin Flutter). Complementa Police Docs / Police Preflight en push.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-site:
    name: Static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: HTML / UTF-8 checks
        run: |
          set -eu
          python3 tool/police/static_check.py > "$RUNNER_TEMP/static.md"
          cat "$RUNNER_TEMP/static.md"
          if grep -q 'police:blocker' "$RUNNER_TEMP/static.md"; then
            echo "::error::Police static_check reportó blockers."
            exit 1
          fi
